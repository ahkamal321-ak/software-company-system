<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects</title>
<link rel="stylesheet" href="style.css">
</head>

<body onload="loadTheme()">

<button class="dark-btn" onclick="toggleDarkMode()">🌙</button>

<div class="dashboard">

<h1>Projects</h1>

<table id="projectsTable"></table>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA07btz16R5Q4wV-ASLFZwm7CZfd789KS4",
  authDomain: "software-company-system.firebaseapp.com",
  projectId: "software-company-system"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.loadProjects = async function(){

    let table = document.getElementById("projectsTable");

    table.innerHTML = `
    <tr>
        <th>Project</th>
        <th>Client</th>
        <th>Deadline</th>
    </tr>`;

    const data = await getDocs(collection(db,"projects"));

    data.forEach(doc=>{
        let p = doc.data();

        table.innerHTML += `
        <tr>
            <td>${p.type}</td>
            <td>${p.client}</td>
            <td>${p.deadline}</td>
        </tr>`;
    });
}

window.onload = loadProjects;
</script>

</body>
</html>
