<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects</title>
<link rel="stylesheet" href="style.css">
</head>

<body onload="loadTheme()">

<button class="dark-btn" onclick="toggleDarkMode()">🌙</button>

<div class="dashboard">

<h1>Projects</h1>

<table id="projectsTable" border="1" cellpadding="10">

<tr>
<th>Project</th>
<th>Client</th>
<th>Deadline</th>
<th>Action</th>
</tr>

</table>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
deleteDoc,
doc

} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {

apiKey: "AIzaSyA07btz16R5Q4wV-ASLFZwm7CZfd789KS4",

authDomain: "software-company-system.firebaseapp.com",

projectId: "software-company-system"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


// 🔥 تحميل المشاريع
async function loadProjects(){

let table = document.getElementById("projectsTable");

table.innerHTML = `
<tr>
<th>Project</th>
<th>Client</th>
<th>Deadline</th>
<th>Action</th>
</tr>
`;

const querySnapshot = await getDocs(collection(db, "projects"));

querySnapshot.forEach((projectDoc) => {

const p = projectDoc.data();

table.innerHTML += `
<tr>

<td>${p.type}</td>

<td>${p.client}</td>

<td>${p.deadline}</td>

<td>

<button onclick="window.deleteProject('${projectDoc.id}')">

Delete

</button>

</td>

</tr>
`;

});

}


// 🔥 حذف مشروع
window.deleteProject = async function(id){

await deleteDoc(doc(db, "projects", id));

alert("Project Deleted 🔥");

loadProjects();

}


// 🔥 تشغيل
loadProjects();

</script>

</body>
</html>
