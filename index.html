<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Software Company System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body onload="loadTheme()">

<button class="dark-btn" onclick="toggleDarkMode()">🌙</button>

<div class="login-container">

    <h1>Software Company System</h1>

    <h2>Login</h2>

    <form onsubmit="loginUser(event)">

        <label>Email</label>

        <input type="email"
               id="loginEmail"
               placeholder="Enter your email"
               required>

        <label>Password</label>

        <input type="password"
               id="loginPassword"
               placeholder="Enter your password"
               required>

        <button type="submit">
            Login
        </button>

    </form>

    <p style="text-align:center; margin-top:20px;">

        Don't have an account?

        <a href="signup.html">
            Create New Account
        </a>

    </p>

</div>


<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {

getAuth,
signInWithEmailAndPassword,
onAuthStateChanged

}

from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";



const firebaseConfig = {

apiKey: "AIzaSyA07btz16R5Q4wV-ASLFZwm7CZfd789KS4",

authDomain: "software-company-system.firebaseapp.com",

projectId: "software-company-system"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);



// 🔥 لو اليوزر مسجل بالفعل
onAuthStateChanged(auth, (user)=>{

if(user){

window.location.href = "dashboard.html";

}

});



// 🔥 Login Function
window.loginUser = async function(event){

event.preventDefault();

let email =
document.getElementById("loginEmail").value.trim();

let password =
document.getElementById("loginPassword").value;


try{

await signInWithEmailAndPassword(
auth,
email,
password
);

alert("Login Successful 🔥");

window.location.href = "dashboard.html";

}catch(error){

if(
error.code === "auth/invalid-credential"
){

alert("Wrong email or password");

}

else{

alert(error.message);

}

}

}

</script>

<script src="script.js"></script>

</body>
</html>
