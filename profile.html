<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Profile</title>

<link rel="stylesheet" href="style.css">

<style>

.profile-container{

max-width:1000px;
margin:auto;

}

.profile-header{

display:flex;
align-items:center;
gap:25px;

background:rgb(252, 250, 250);

padding:30px;

border-radius:20px;

box-shadow:0 5px 15px rgba(0,0,0,0.1);

margin-top:20px;

}

.profile-image{

width:120px;
height:120px;

border-radius:50%;

background:#2563eb;

display:flex;
align-items:center;
justify-content:center;

font-size:45px;
color:rgb(247, 243, 243);
font-weight:bold;

}

.profile-info h2{

margin-bottom:10px;

}

.profile-info p{

color:gray;
margin:5px 0;

}

.cards{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));

gap:20px;

margin-top:30px;

}

.card{

background:rgb(250, 249, 249);

padding:25px;

border-radius:18px;

text-align:center;

box-shadow:0 5px 15px rgba(0,0,0,0.1);

}

.card h2{

font-size:35px;

margin-bottom:10px;

}

.details-section{

background:rgb(247, 245, 245);

padding:30px;

border-radius:20px;

margin-top:30px;

box-shadow:0 5px 15px rgba(0,0,0,0.1);

}

table{

width:100%;
border-collapse:collapse;
margin-top:20px;

}

th, td{

padding:14px;
border:1px solid #ccc;
text-align:left;

}

th{

background:#050505;

width:30%;

}

.status{

color:#16a34a;
font-weight:bold;

}

</style>

</head>

<body onload="loadTheme()">

<button class="dark-btn"
onclick="toggleDarkMode()">

🌙

</button>

<div class="dashboard profile-container">

<h1>My Profile</h1>


<nav class="modern-nav">

<a href="dashboard.html">Dashboard</a>

<a href="employees.html">Employees</a>

<a href="tasks.html">Tasks</a>

<a href="projects.html">Projects</a>

</nav>

<hr>



<!-- 🔥 PROFILE HEADER -->
<div class="profile-header">

<div class="profile-image"
id="profileLetter">

A

</div>


<div class="profile-info">

<h2 id="profileName">

Loading...

</h2>

<p id="profileEmail">

Loading...

</p>

<p>

Software Company System User

</p>

</div>

</div>



<!-- 🔥 QUICK STATS -->
<div class="cards">

<div class="card">

<h3>Projects</h3>

<h2 id="projectsCount">0</h2>

</div>


<div class="card">

<h3>Tasks</h3>

<h2 id="tasksCount">0</h2>

</div>


<div class="card">

<h3>Status</h3>

<h2 class="status">

Active

</h2>

</div>

</div>



<!-- 🔥 USER DETAILS -->
<div class="details-section">

<h2>User Information</h2>

<table>

<tr>

<th>Full Name</th>

<td id="fullName">

Loading...

</td>

</tr>


<tr>

<th>Email</th>

<td id="email">

Loading...

</td>

</tr>


<tr>

<th>Role</th>

<td id="role">

User

</td>

</tr>


<tr>

<th>Department</th>

<td>

Software Development

</td>

</tr>


<tr>

<th>Account Status</th>

<td class="status">

Active

</td>

</tr>

</table>

</div>

</div>



<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {

getAuth,
onAuthStateChanged

}

from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {

getFirestore,
collection,
getDocs

}

from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";



const firebaseConfig = {

apiKey: "AIzaSyA07btz16R5Q4wV-ASLFZwm7CZfd789KS4",

authDomain: "software-company-system.firebaseapp.com",

projectId: "software-company-system"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);



// 🔥 USER DATA
onAuthStateChanged(auth, async(user)=>{

if(user){

// اسم المستخدم
let userName = user.displayName;

if(!userName){

userName = localStorage.getItem("fullName");

}


// Email
let userEmail =
user.email;


// أول حرف
document.getElementById(
"profileLetter"
).innerText =
userName.charAt(0).toUpperCase();


// البيانات
document.getElementById(
"profileName"
).innerText =
userName;


document.getElementById(
"profileEmail"
).innerText =
userEmail;


document.getElementById(
"fullName"
).innerText =
userName;


document.getElementById(
"email"
).innerText =
userEmail;

}

});



// 🔥 LOAD STATS
async function loadStats(){


// Projects Count
const projectsSnapshot =await getDocs(collection(db,"projects"));

document.getElementById(
"projectsCount"
).innerText =
projectsSnapshot.size;



// Tasks Count
const tasksSnapshot =
await getDocs(collection(db,"tasks"));

document.getElementById(
"tasksCount"
).innerText =
tasksSnapshot.size;

}



loadStats();

</script>

<script src="script.js"></script>

</body>
</html>
