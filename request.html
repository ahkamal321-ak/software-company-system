<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Request Project</title>

<link rel="stylesheet" href="style.css">

<style>

form{

display:flex;
flex-direction:column;
gap:15px;
margin-top:20px;

}

input, select{

padding:12px;
border-radius:10px;
border:1px solid #ccc;

}

button{

padding:12px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
font-weight:bold;
cursor:pointer;

}

</style>

</head>

<body onload="loadTheme()">

<button class="dark-btn"
onclick="toggleDarkMode()">

🌙

</button>

<div class="dashboard">

<h1>Request New Project</h1>

<form onsubmit="addProject(event)">


<input
type="text"
id="client"
placeholder="Client Name"
required>


<input
type="text"
id="company"
placeholder="Company Name"
required>


<input
type="email"
id="email"
placeholder="Email"
required>


<select id="type">

<option>Website</option>

<option>Mobile App</option>

<option>Desktop System</option>

<option>CRM</option>

</select>


<input
type="text"
id="description"
placeholder="Project Description"
required>


<input
type="number"
id="budget"
placeholder="Budget"
required>


<input
type="date"
id="deadline"
required>


<select id="status">

<option>Pending</option>

<option>In Progress</option>

<option>Completed</option>

</select>


<button type="submit">

Add Project

</button>

</form>

</div>



<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {

getFirestore,
collection,
addDoc

}

from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";



const firebaseConfig = {

apiKey: "AIzaSyA07btz16R5Q4wV-ASLFZwm7CZfd789KS4",

authDomain: "software-company-system.firebaseapp.com",

projectId: "software-company-system",

storageBucket:
"software-company-system.firebasestorage.app",

messagingSenderId:
"332239602283",

appId:
"1:332239602283:web:a309eee060b7b83a4d672e"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);



// 🔥 Add Project
window.addProject = async function(e){

e.preventDefault();


await addDoc(collection(db,"projects"),{

client:
document.getElementById("client").value,

company:
document.getElementById("company").value,

email:
document.getElementById("email").value,

type:
document.getElementById("type").value,

description:
document.getElementById("description").value,

budget:
document.getElementById("budget").value,

deadline:
document.getElementById("deadline").value,

status:
document.getElementById("status").value

});


alert("Project Added Successfully 🔥");


// تنظيف الفورم
document.querySelector("form").reset();

}

</script>

<script src="script.js"></script>

</body>
</html>
