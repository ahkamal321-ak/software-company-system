<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Freelancers Management</title>

<link rel="stylesheet" href="style.css">

<style>

table{

width:100%;
border-collapse:collapse;
margin-top:20px;

}

th, td{

padding:14px;
border:1px solid #ccc;
text-align:center;

}

th{

background:#1e293b;
color:white;

}

form{

display:flex;
flex-direction:column;
gap:15px;
margin-top:25px;

}

input, select{

padding:12px;
border-radius:10px;
border:1px solid #ccc;

}

button{

padding:12px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:bold;

}

.add-btn{

background:#2563eb;
color:white;

}

.delete-btn{

background:#dc2626;
color:white;

}

.cards{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));

gap:20px;

margin-top:30px;
margin-bottom:30px;

}

.card{

background:#f8f9fa;

color:white;

padding:25px;

border-radius:18px;

text-align:center;

box-shadow:0 5px 15px rgba(0,0,0,0.2);

}

.card h2{

font-size:35px;

}

.available{

color:#16a34a;
font-weight:bold;

}

.busy{

color:#dc2626;
font-weight:bold;

}

</style>

</head>

<body onload="loadTheme()">

<button class="dark-btn"
onclick="toggleDarkMode()">

🌙

</button>

<div class="dashboard">

<h1>Freelancers Management</h1>


<nav class="modern-nav">

<a href="dashboard.html">Dashboard</a>

<a href="projects.html">Projects</a>

<a href="tasks.html">Tasks</a>

<a href="clients.html">Clients</a>

</nav>

<hr>


<!-- 🔥 SUMMARY -->
<div class="cards">

<div class="card">

<h3>Total Freelancers</h3>

<h2 id="totalFreelancers">0</h2>

</div>


<div class="card">

<h3>Available</h3>

<h2 id="availableFreelancers">0</h2>

</div>


<div class="card">

<h3>Busy</h3>

<h2 id="busyFreelancers">0</h2>

</div>

</div>



<h2>Freelancers List</h2>


<table id="freelancersTable">

<tr>

<th>Name</th>

<th>Specialization</th>

<th>Experience</th>

<th>Status</th>

<th>Rate</th>

<th>Action</th>

</tr>

</table>


<hr>


<h2>Add Freelancer</h2>


<form onsubmit="addFreelancer(event)">


<input
type="text"
id="name"
placeholder="Freelancer Name"
required>


<select id="specialization">

<option>Frontend Developer</option>

<option>Backend Developer</option>

<option>Full Stack Developer</option>

<option>UI/UX Designer</option>

<option>Graphic Designer</option>

<option>Mobile Developer</option>

<option>Database Engineer</option>

</select>


<input
type="text"
id="experience"
placeholder="Experience Example: 3 Years"
required>


<select id="status">

<option>Available</option>

<option>Busy</option>

</select>


<input
type="number"
id="rate"
placeholder="Hourly Rate ($)"
required>


<button
type="submit"
class="add-btn">

Add Freelancer

</button>

</form>

</div>



<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {

getFirestore,
collection,
addDoc,
getDocs,
deleteDoc,
doc

}

from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";



const firebaseConfig = {

apiKey: "AIzaSyA07btz16R5Q4wV-ASLFZwm7CZfd789KS4",

authDomain: "software-company-system.firebaseapp.com",

projectId: "software-company-system"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);



// 🔥 Add Freelancer
window.addFreelancer = async function(e){

e.preventDefault();


await addDoc(collection(db,"freelancers"),{

name:
document.getElementById("name").value,

specialization:
document.getElementById("specialization").value,

experience:
document.getElementById("experience").value,

status:
document.getElementById("status").value,

rate:
document.getElementById("rate").value

});


alert("Freelancer Added 🔥");


document.querySelector("form").reset();

loadFreelancers();

}



// 🔥 Load Freelancers
async function loadFreelancers(){


let table =
document.getElementById("freelancersTable");


table.innerHTML = `

<tr>

<th>Name</th>

<th>Specialization</th>

<th>Experience</th>

<th>Status</th>

<th>Rate</th>

<th>Action</th>

</tr>

`;


let total = 0;let available = 0;

let busy = 0;


const querySnapshot =
await getDocs(collection(db,"freelancers"));


querySnapshot.forEach((freelancerDoc)=>{

let f = freelancerDoc.data();

total++;


if(f.status === "Available"){

available++;

}else{

busy++;

}


table.innerHTML += `

<tr>

<td>${f.name}</td>

<td>${f.specialization}</td>

<td>${f.experience}</td>

<td class="${
f.status === "Available"
? "available"
: "busy"
}">

${f.status}

</td>

<td>$${f.rate}/h</td>

<td>

<button
class="delete-btn"
onclick="deleteFreelancer('${freelancerDoc.id}')">

Delete

</button>

</td>

</tr>

`;

});



// 🔥 Summary
document.getElementById(
"totalFreelancers"
).innerText = total;


document.getElementById(
"availableFreelancers"
).innerText = available;


document.getElementById(
"busyFreelancers"
).innerText = busy;

}



// 🔥 Delete Freelancer
window.deleteFreelancer = async function(id){

await deleteDoc(doc(db,"freelancers",id));

alert("Freelancer Deleted 🔥");

loadFreelancers();

}



// 🔥 تشغيل
loadFreelancers();

</script>

<script src="script.js"></script>

</body>
</html>
