<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Finance Management</title>

    <link rel="stylesheet" href="style.css">

    <style>

        table{

            width:100%;
            border-collapse:collapse;
            margin-top:20px;

        }

        th, td{

            padding:14px;
            border:1px solid #ccc;
            text-align:center;

        }

        th{

            background:#1e293b;
            color:white;

        }

        .summary-cards{

            display:grid;

            grid-template-columns:
            repeat(auto-fit,minmax(220px,1fr));

            gap:20px;

            margin-top:30px;
            margin-bottom:30px;

        }

        .summary-card{

            background:#1e293b;

            color:white;

            padding:25px;

            border-radius:18px;

            text-align:center;

            box-shadow:0 5px 15px rgba(0,0,0,0.2);

        }

        .summary-card h2{

            font-size:35px;

        }

    </style>

</head>

<body onload="loadTheme()">

<button class="dark-btn"
onclick="toggleDarkMode()">

🌙

</button>


<div class="dashboard">

<h1>Finance Management</h1>


<nav class="modern-nav">

<a href="dashboard.html">Dashboard</a>

<a href="employees.html">Employees</a>

<a href="projects.html">Projects</a>

<a href="tasks.html">Tasks</a>

</nav>

<hr>


<!-- 🔥 SUMMARY -->
<div class="summary-cards">

<div class="summary-card">

<h3>Total Revenue</h3>

<h2 id="totalRevenue">$0</h2>

</div>


<div class="summary-card">

<h3>Completed Projects</h3>

<h2 id="completedProjects">0</h2>

</div>


<div class="summary-card">

<h3>Pending Projects</h3>

<h2 id="pendingProjects">0</h2>

</div>

</div>



<h2>Projects Financial Details</h2>


<table id="financeTable">

<tr>

<th>Project</th>

<th>Client</th>

<th>Budget</th>

<th>Deadline</th>

<th>Status</th>

</tr>

</table>

</div>



<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {

getFirestore,
collection,
getDocs

}

from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";



const firebaseConfig = {

apiKey: "AIzaSyA07btz16R5Q4wV-ASLFZwm7CZfd789KS4",

authDomain: "software-company-system.firebaseapp.com",

projectId: "software-company-system"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);



// 🔥 تحميل البيانات المالية
async function loadFinance(){


let table =
document.getElementById("financeTable");


table.innerHTML = `

<tr>

<th>Project</th>

<th>Client</th>

<th>Budget</th>

<th>Deadline</th>

<th>Status</th>

</tr>

`;


let totalRevenue = 0;

let completed = 0;

let pending = 0;


const querySnapshot =
await getDocs(collection(db,"projects"));



querySnapshot.forEach((projectDoc)=>{

let p = projectDoc.data();


// 🔥 Budget
let budget =
parseInt(p.budget) || 0;

totalRevenue += budget;


// 🔥 Status
let status =
p.status || "Pending";


if(status === "Completed"){

completed++;

}else{

pending++;

}


// 🔥 Table
table.innerHTML += `

<tr>

<td>${p.type}</td>

<td>${p.client}</td>

<td>$${budget}</td>

<td>${p.deadline}</td>

<td>${status}</td>

</tr>

`;

});



// 🔥 Summary
document.getElementById(
"totalRevenue"
).innerText =
"$" + totalRevenue;


document.getElementById(
"completedProjects"
).innerText =
completed;


document.getElementById(
"pendingProjects"
).innerText =
pending;

}



// 🔥 تشغيل
loadFinance();

</script>

<script src="script.js"></script>

</body>
</html>
