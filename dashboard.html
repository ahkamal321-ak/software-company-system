<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .modern-nav{

            display:flex;
            flex-wrap:wrap;
            gap:15px;

            margin-top:25px;
            margin-bottom:30px;

        }

        .modern-nav a{

            text-decoration:none;
            padding:12px 18px;

            border-radius:12px;

            background:#1e293b;

            color:white;

            font-weight:bold;

            transition:0.3s;

        }

        .modern-nav a:hover{

            transform:translateY(-4px);

            background:#334155;

        }

        .logout-btn{

            background:#dc2626 !important;

        }

        .logout-btn:hover{

            background:#b91c1c !important;

        }


        .cards{

            display:grid;

            grid-template-columns:
            repeat(auto-fit,minmax(220px,1fr));

            gap:20px;

            margin-top:30px;

        }

        .card{

            padding:30px;

            border-radius:18px;

            background:#eff3f3;

            color:white;

            text-align:center;

            box-shadow:0 5px 15px rgba(0,0,0,0.2);

            transition:0.3s;

        }

        .card:hover{

            transform:translateY(-5px);

        }

        .card h3{

            font-size:45px;

            margin-bottom:10px;

        }

    </style>

</head>

<body onload="loadTheme()">

<button class="dark-btn" onclick="toggleDarkMode()">🌙</button>

<div class="dashboard">

<h1>Dashboard</h1>


<!-- 🔥 NAVBAR -->
<nav class="modern-nav">

<a href="profile.html">👤 Profile</a>

<a href="employees.html">👨‍💻 Employees</a>

<a href="projects.html">📁 Projects</a>

<a href="tasks.html">✅ Tasks</a>

<a href="clients.html">🤝 Clients</a>

<a href="request.html">🚀 Requests</a>

<a href="finance.html">💰 Finance</a>

<a href="reports.html">📊 Reports</a>

<a href="notifications.html">🔔 Notifications</a>

<a href="freelancers.html">🌍 Freelancers</a>

<a href="#"
class="logout-btn"
onclick="logoutUser()">

🚪 Logout

</a>

</nav>

<hr>

<h2>System Overview</h2>


<!-- 🔥 DYNAMIC CARDS -->
<div class="cards">

<div class="card">

<h3 id="employeesCount">0</h3>

<p>Employees</p>

</div>


<div class="card">

<h3 id="projectsCount">0</h3>

<p>Projects</p>

</div>


<div class="card">

<h3 id="clientsCount">0</h3>

<p>Clients</p>

</div>


<div class="card">

<h3 id="tasksCount">0</h3>

<p>Tasks</p>

</div>

</div>


<div class="card">

<h3 id="freelancersCount">0</h3>

<p>Freelancers</p>

</div>


</div>


<script src="script.js"></script>


<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {

getAuth,
signOut

}

from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";


import {

getFirestore,
collection,
getCountFromServer

}

from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";



const firebaseConfig = {

apiKey: "AIzaSyA07btz16R5Q4wV-ASLFZwm7CZfd789KS4",

authDomain: "software-company-system.firebaseapp.com",

projectId: "software-company-system"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);



// 🔥 Dashboard Stats
async function loadDashboardStats(){


// Employees
const employeesSnapshot =
await getCountFromServer(
collection(db,"employees")
);

document.getElementById(
"employeesCount"
).innerText =
employeesSnapshot.data().count;



// Projects
const projectsSnapshot =
await getCountFromServer(
collection(db,"projects")
);

document.getElementById(
"projectsCount"
).innerText =
projectsSnapshot.data().count;



// Clients
const clientsSnapshot =
await getCountFromServer(
collection(db,"projects")
);

document.getElementById(
"clientsCount"
).innerText =
clientsSnapshot.data().count;



// Tasks
const tasksSnapshot =
await getCountFromServer(
collection(db,"tasks")
);

document.getElementById(
"tasksCount"
).innerText =
tasksSnapshot.data().count;

// Freelancers
const freelancersSnapshot =
await getCountFromServer(
collection(db,"freelancers")
);

document.getElementById(
"freelancersCount"
).innerText =
freelancersSnapshot.data().count;

}

// 🔥 Logout
window.logoutUser = async function(){

await signOut(auth);

alert("Logged Out Successfully");

window.location.href = "index.html";

}



// 🔥 تشغيل
loadDashboardStats();

</script>

</body>
</html>
